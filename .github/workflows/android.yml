name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.6.3
      BUILD_TOOLS: 36.1.0
      ANDROID_DEBUG_KEYSTORE: ${{ github.workspace }}/.local/android-debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;${BUILD_TOOLS}"
      - name: Install Godot and Android templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 -o /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 -o /tmp/templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          templates_dir="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "${templates_dir}"
          unzip -j -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk -d "${templates_dir}"
      - name: Create temporary debug signing key
        run: |
          mkdir -p .local
          keytool -genkeypair -noprompt -keystore "$ANDROID_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Archipielago Debug,O=Boombeachhs,C=CL"
          python3 tools/configure_android.py
      - name: Import project
        run: godot --headless --editor --path . --import --quit
      - name: Run logic tests
        run: godot --headless --path . --script tests/test_game.gd
      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug Android build/archipielago-libre-debug.apk 2>&1 | tee build/export.log
          test -s build/archipielago-libre-debug.apk
      - name: Verify signature and offline manifest
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="${ANDROID_HOME}/build-tools/${BUILD_TOOLS}"
          "$tools_dir/apksigner" verify --verbose build/archipielago-libre-debug.apk | tee build/signature.txt
          "$tools_dir/aapt" dump permissions build/archipielago-libre-debug.apk | tee build/permissions.txt
          if grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' build/permissions.txt; then
            echo 'Unexpected network permission in offline APK' >&2
            exit 1
          fi
          "$tools_dir/aapt" dump badging build/archipielago-libre-debug.apk > build/package.txt
          grep -q "package: name='com.hsalazar66.archipielagolibre'" build/package.txt
          grep -q "native-code:.*arm64-v8a" build/package.txt
          sha256sum build/archipielago-libre-debug.apk > build/SHA256SUMS.txt
      - name: Upload APK and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: archipielago-libre-android-${{ github.run_number }}
          path: build/
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## APK de prueba
          Descarga el artefacto **archipielago-libre-android** al final de esta ejecución, extrae el ZIP e instala `archipielago-libre-debug.apk` en Android 7 o posterior (ARM/ARM64).

          Firma de depuración temporal: cada ejecución genera una clave diferente. Para cambiar de compilación puede ser necesario desinstalar la anterior; exporta antes tu respaldo. No es una versión de producción ni se ha probado en un teléfono físico.

          Se verificaron la firma, el identificador del paquete, ARM64 y la ausencia de permisos de red. El artefacto incluye SHA-256 y registros. No se incluye la clave de firma.
          SUMMARY
